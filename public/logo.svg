<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="logoEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0a2540" />
    </linearGradient>
    <linearGradient id="dropGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Group: Emblem Icon -->
  <g transform="translate(4, 6)">
    <!-- Rounded Outer Shield Box -->
    <rect x="0" y="0" width="68" height="68" rx="18" fill="url(#logoEmblemGrad)" filter="url(#shadow)" />
    <!-- Pipe ring accent -->
    <circle cx="34" cy="34" r="24" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="4 3" />
    <!-- Water Drop -->
    <path d="M34 14 C34 14, 21 30, 21 38 C21 45.18 26.82 51 34 51 C41.18 51 47 45.18 47 38 C47 30, 34 14, 34 14 Z" fill="url(#dropGrad2)" />
    <!-- Plumber Wrench Icon overlaid -->
    <g transform="translate(24, 24) scale(0.85)" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
    </g>
    <!-- Glistening water highlight -->
    <path d="M28 40 C30 43 33 44 36 44" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85" />
  </g>

  <!-- Typography: Brand Name -->
  <g transform="translate(86, 12)">
    <!-- SYD'S -->
    <text x="0" y="30" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#0A2540" letter-spacing="-0.5">
      SYD'S
    </text>
    <!-- Pipe Connector Dot / Accent -->
    <circle cx="94" cy="20" r="3" fill="#0284c7" />

    <!-- PLUMBING -->
    <text x="105" y="30" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#0284c7" letter-spacing="1">
      PLUMBING
    </text>

    <!-- Subtitle: Morrisville, NC & Tagline -->
    <g transform="translate(0, 48)">
      <rect x="0" y="-12" width="112" height="18" rx="4" fill="#E0F2FE" />
      <text x="6" y="0" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#0369A1" letter-spacing="0.8">
        MORRISVILLE, NC
      </text>

      <text x="122" y="0" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="0.2">
        • FAST &amp; TRUSTED LOCAL EXPERTS
      </text>
    </g>
  </g>
</svg>
